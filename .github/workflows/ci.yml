name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The harness's documented floor — the oldest version we claim to
      # support is the one most likely to break.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Harness tests
        run: python3 -m unittest discover tests

      - name: Authenticate FontAwesome registry
        # pnpm only honors registry credentials from user-level config,
        # never from the committed project .npmrc
        run: echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> ~/.npmrc
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: API contracts in sync
        run: pnpm check:generated

      - name: i18n catalogs in sync with source
        run: |
          pnpm --filter web extract
          git diff --exit-code -- apps/web/src/locales

      - name: i18n translations complete
        run: pnpm --filter web exec lingui compile --strict

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
