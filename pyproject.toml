# Repo-root Python tooling config for the harness scripts and tests.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".harness",
  "phases",
]

[tool.ruff.lint]
# Selected rule families:
# - E, W: pycodestyle errors and warnings
# - F:    pyflakes (unused imports, undefined names, etc.)
# - I:    isort (import order)
# - B:    flake8-bugbear (likely bugs)
# - UP:   pyupgrade (modern Python syntax)
# - SIM:  flake8-simplify (simplifiable code)
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # line-too-long — line-length already enforces, formatter handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "B011",  # assert False — used in test stubs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
