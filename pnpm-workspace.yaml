packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Postinstall downloads the platform's native claude binary; without it the
  # harness's spawned agents (writer/fixer/reviewer/retro) have no CLI to run.
  "@anthropic-ai/claude-code": true
  unrs-resolver: true
packageExtensions:
  # Upstream bug: the plugin's .d.ts does `import("fastify")` but the package
  # declares no fastify dependency/peer, so under pnpm's strict layout its
  # types collapse to `any` (hidden by skipLibCheck, caught by lint).
  "@scalar/fastify-api-reference":
    peerDependencies:
      fastify: "*"
minimumReleaseAgeExclude:
  # FontAwesome Pro lives on a private vendor registry; the release-age check
  # would need registry auth in every consumer (including services that never
  # install FontAwesome, e.g. api), so skip it for the whole scope.
  - "@fortawesome/*"
  - "@turbo/darwin-64@2.10.6"
  - "@turbo/darwin-arm64@2.10.6"
  - "@turbo/linux-64@2.10.6"
  - "@turbo/linux-arm64@2.10.6"
  - "@turbo/windows-64@2.10.6"
  - "@turbo/windows-arm64@2.10.6"
  - "@vitejs/plugin-react@6.0.4"
  - turbo@2.10.6
  - "@eslint-react/ast@5.18.0"
  - "@eslint-react/core@5.18.0"
  - "@eslint-react/eslint-plugin@5.18.0"
  - "@eslint-react/eslint@5.18.0"
  - "@eslint-react/jsx@5.18.0"
  - "@eslint-react/shared@5.18.0"
  - "@eslint-react/var@5.18.0"
  - eslint-plugin-react-dom@5.18.0
  - eslint-plugin-react-jsx@5.18.0
  - eslint-plugin-react-naming-convention@5.18.0
  - eslint-plugin-react-rsc@5.18.0
  - eslint-plugin-react-web-api@5.18.0
  - eslint-plugin-react-x@5.18.0
